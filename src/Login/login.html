<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PetCare</title>
    <link rel="stylesheet" href="../output.css">
    <script src="login.js" defer></script>
</head>

<body class="flex min-h-screen flex-col">
    <header>
        <nav>
            <a href="../../index.html">
                <img src="../../imagens/logosemfundo.png" alt="Logo PetCare">
            </a>
            <div>
                <a href="../../index.html">Voltar ao início</a>
            </div>
        </nav>
    </header>

    <main class="flex flex-1 items-center justify-center px-4 py-12">
        <section class="w-full max-w-md">
            <div class="rounded-2xl bg-white px-8 py-10 shadow-[0_4px_12px_rgba(23,73,54,0.08)]">
                <p class="mb-2 text-sm font-bold uppercase tracking-[3px] text-[#16834A]">Área de acesso</p>
                <h1 class="mb-2 text-3xl font-bold text-[#174936]">Entrar no PetCare</h1>
                <p class="mb-6 text-[15px] text-[#647067]">Faça login para acompanhar a rotina de cuidados do seu pet.</p>

                <form onsubmit="return logar();">
                    <label for="login" class="mb-1 block font-bold text-[#174936]">Usuário</label>
                    <input type="text" id="login" placeholder="Digite seu usuário" required
                        class="mb-4 w-full rounded-lg border border-[#d6e3d9] bg-white px-4 py-3 focus:border-[#16834A] focus:outline-2 focus:outline-[#16834A]">

                    <label for="senha" class="mb-1 block font-bold text-[#174936]">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required
                        class="mb-4 w-full rounded-lg border border-[#d6e3d9] bg-white px-4 py-3 focus:border-[#16834A] focus:outline-2 focus:outline-[#16834A]">

                    <p id="mensagem" class="mb-4 min-h-6 text-sm font-bold text-[#b42318]"></p>

                    <button type="submit"
                        class="w-full cursor-pointer rounded-lg bg-[#16834A] py-3 font-bold text-white transition-colors duration-300 hover:bg-[#174936]">
                        Entrar
                    </button>
                </form>
            </div>

            <aside class="mt-5 rounded-2xl border border-dashed border-[#16834A] bg-[#E5F3E7] px-6 py-4 text-[15px] text-[#174936]">
                <h2 class="mb-1 font-bold">Acesso de demonstração</h2>
                <p>Usuário: <strong>admin</strong></p>
                <p>Senha: <strong>1234</strong></p>
            </aside>
        </section>
    </main>

    <footer>
        <div>
            <img src="../../imagens/logosemfundo.png" alt="Logo PetCare">
            <p>Cuidando melhor de quem faz parte da nossa família.</p>
        </div>
        <div>
            <h3>Projeto</h3>
            <p>Integrantes: Lucas Azevedo e Maria Luiza</p>
            <p>Turma: TSI 2026.2 - IFRN</p>
        </div>
    </footer>
</body>

</html>
